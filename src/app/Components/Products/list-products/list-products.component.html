<div class="products-container">
  @if (category) {
    <header class="category-header">
      <div class="header-left">
        <span class="section-label">
          <i class="ti ti-sword"></i>
          {{ category.name | uppercase }}
        </span>
        <h1>Servicios Disponibles</h1>
        <div class="ornament-divider">
          <span class="ornament-diamond"></span>
        </div>
      </div>
      <div class="header-badge">
        <i class="ti ti-flame"></i>
        <span>Boost Premium</span>
      </div>
    </header>
  }

  @if (loading) {
    <div class="loading">
      <div class="spinner"></div>
      <span>Invocando servicios de boosting...</span>
    </div>
  } @else if (error) {
    <div class="error">
      <i class="ti ti-alert-triangle"></i>
      <span>{{ error }}</span>
    </div>
  } @else {
    <div class="products-list">
      @for (x of productList; track $index) {
        <article class="product-card">
          <div class="product-banner">
            <img [src]="x.images?.[0]" [alt]="x.name" class="product-image" />
            <div class="banner-overlay"></div>
            <div class="rune-glow"></div>

            <!-- Contenedor de acciones flotantes -->
            <div class="banner-actions">
              <button
                class="wish-btn"
                aria-label="Add to wishlist"
                type="button"
                title="Add to WishList"
              >
                <i class="bi bi-heart"></i>
              </button>

              <button
                class="btn-icon btn-delete"
                (click)="delete(x.id)"
                aria-label="Delete Product"
                title="Eliminar servicio"
              >
                <i class="bi bi-trash"></i>
              </button>
            </div>
          </div>
          <div class="product-body">
            <h3 class="product-title">{{ x.name }}</h3>
            <p class="product-description">{{ x.description }}</p>

            <div class="product-footer">
              <div class="product-price">
                <span class="price-label">Starting at</span>
                <span class="price-value">
                  <i class="ti ti-coin"></i>
                  {{ x.price | currency }}
                </span>
              </div>

              <button class="btn-service" type="button" (click)="addToCart(x)">
                <i class="ti ti-arrow-right"> Add to Cart </i>
              </button>
            </div>
          </div>
        </article>
      }
    </div>
  }
</div>

@if (toasts$ | async; as toasts) {
  <div class="toast-stack" aria-live="polite" aria-atomic="false">
    @for (toast of toasts; track toast.id) {
      <div class="toast" [class.success]="toast.type === 'success'" [class.error]="toast.type === 'error'" [class.info]="toast.type === 'info'">
        <i
          class="bi"
          [class.bi-check-circle-fill]="toast.type === 'success'"
          [class.bi-x-circle-fill]="toast.type === 'error'"
          [class.bi-info-circle-fill]="toast.type === 'info'"
        ></i>

        <span>{{ toast.message }}</span>

        <button type="button" aria-label="Cerrar" (click)="toastService.dismiss(toast.id)">
          <i class="bi bi-x-lg"></i>
        </button>
      </div>
    }
  </div>
}
